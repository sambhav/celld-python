name: Python distribution
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified celld distribution to PyPI
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and exercise the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'from importlib.metadata import distribution; from importlib.resources import files; from celld import App, Client; d = distribution("celld"); assert {e.name for e in d.entry_points if e.group == "console_scripts"} == {"pycelld"}; assert files("celld").joinpath("runtime/host.js").is_file(); assert files("celld").joinpath("licenses/CPYTHON.txt").is_file()'
          "$RUNNER_TEMP/wheel-env/bin/pycelld" --help
          "$RUNNER_TEMP/wheel-env/bin/pycelld" init hello-wheel
          "$RUNNER_TEMP/wheel-env/bin/python" -c 'import sys; sys.path.insert(0, "hello-wheel/src"); import app; assert app.hello() == "Hello, world"'
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/celld/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
