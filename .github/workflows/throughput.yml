name: warm throughput and real HTTP I/O
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
env:
  CELLD_NATIVE_SHA: 1c5e12e0d2c5000e5a2d837413d16ce6123ee1ec
jobs:
  native:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark-throughput'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sambhav/celld
          ref: ${{ env.CELLD_NATIVE_SHA }}
          path: upstream
      - run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/target
          key: celld-density-a52f990-1.98.1-${{ env.CELLD_NATIVE_SHA }}
          restore-keys: celld-density-a52f990-1.98.1-
      - run: |
          test "$(git -C upstream rev-parse HEAD)" = "$CELLD_NATIVE_SHA"
          cargo test --manifest-path upstream/tools/packing-checks/Cargo.toml --locked
          cargo build --manifest-path upstream/Cargo.toml -p celld --profile lab --locked
          upstream/target/lab/celld --version
      - uses: actions/upload-artifact@v4
        with:
          name: throughput-native
          path: upstream/target/lab/celld
  measure:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        delay: [0, 10, 50]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: throughput-native
          path: native-bin
      - run: |
          chmod +x native-bin/celld
          echo "$GITHUB_WORKSPACE/native-bin" >> "$GITHUB_PATH"
          python -m pip install -e . pytest pytest-asyncio
          npm install -g esbuild@0.25.12
      - uses: actions/cache@v4
        with:
          path: |
            examples/.celld-python/cache
            examples/hello/.celld-python/cache
          key: pyodide-314.0.6-${{ hashFiles('examples/**/celld.lock.json') }}
      - run: |
          pycelld lock examples/fleet.toml
          git diff --exit-code -- examples/celld.lock.json
          cd experiments/throughput/load
          go test -race ./...
      - name: Screen concurrency, then repeat each best configuration
        env:
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python experiments/throughput/measure.py --io-delay-ms ${{ matrix.delay }} --clients 1 16 64 256 1024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: throughput-delay-${{ matrix.delay }}ms
          path: |
            experiments/throughput/build/**/*.json
            experiments/throughput/build/**/*.log
