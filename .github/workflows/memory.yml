name: idle memory diagnostic
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'benchmark-memory'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e . pytest
      - run: npm install -g esbuild@0.25.12
      - name: Install pinned celld
        run: |
          mkdir -p "$RUNNER_TEMP/bench-bin"
          curl -fsSL --retry 3 https://github.com/denoland/celld/releases/download/v0.4.0/celld-x86_64-unknown-linux-gnu.gz -o /tmp/celld.gz
          echo '0488628597154725db2f61f85434fb381e1b2535d1e9f097c6d20727cd337973  /tmp/celld.gz' | sha256sum -c -
          gunzip -c /tmp/celld.gz > "$RUNNER_TEMP/bench-bin/celld"
          chmod +x "$RUNNER_TEMP/bench-bin/celld"
          echo "$RUNNER_TEMP/bench-bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: examples/.celld-python/cache
          key: pyodide-314.0.6-${{ hashFiles('examples/**/celld.lock.json') }}
      - run: |
          pycelld lock examples/fleet.toml
          git diff --exit-code -- examples/celld.lock.json
      - name: Measure memory after eviction settles
        env:
          BENCH_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python experiments/memory/measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: idle-memory
          path: |
            experiments/memory/build/*.json
            experiments/memory/build/*.md
            experiments/memory/build/*.log
