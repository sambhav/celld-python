[package]
name = "celld-runtime"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust WASM host for bundled Python workers on celld"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = "debuginfo"
